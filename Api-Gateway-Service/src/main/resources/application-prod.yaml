spring:
  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://frontend-cal-track.onrender.com"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

            allowedHeaders: "*"

            allowCredentials: true

      routes:

        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**

        - id: calorie-service
          uri: ${CALORIE_SERVICE_URL}
          predicates:
            - Path=/api/calorie/**

jwt:
  secret: ${JWT_SECRET}